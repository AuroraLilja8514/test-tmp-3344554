name: Production launcher CI

on:
  push:
    branches: [phase1-production-launcher]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'native-probe/**'
      - '.github/workflows/production-ci.yml'
      - 'LICENSE'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'native-probe/**'
      - '.github/workflows/production-ci.yml'
      - 'LICENSE'

permissions:
  contents: write

jobs:
  build-win-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Initialize MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch and build Microsoft Detours
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/microsoft/Detours.git "%RUNNER_TEMP%\detours"
          cd /d "%RUNNER_TEMP%\detours\src"
          nmake
          if errorlevel 1 exit /b 1

      - name: Build native helpers
        shell: cmd
        run: |
          if not exist out\native mkdir out\native
          cl /nologo /std:c++20 /EHsc /MD /LD native-probe\tzshim.cpp native-probe\tzshim.def /I"%RUNNER_TEMP%\detours\src" /link /OUT:out\native\CodexTzShim64.dll /LIBPATH:"%RUNNER_TEMP%\detours\lib.X64" detours.lib advapi32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /EHsc /MD /LD native-probe\tzbroker.cpp native-probe\tzbroker.def /I"%RUNNER_TEMP%\detours\src" /link /OUT:out\native\CodexTzBroker64.dll /LIBPATH:"%RUNNER_TEMP%\detours\lib.X64" detours.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /EHsc /MD native-probe\tzshim-launcher.cpp /I"%RUNNER_TEMP%\detours\src" /link /OUT:out\native\tzshim-launcher.exe /LIBPATH:"%RUNNER_TEMP%\detours\lib.X64" detours.lib
          if errorlevel 1 exit /b 1

      - name: Build launcher
        shell: pwsh
        run: dotnet build .\src\CodexTimeZoneLauncher\CodexTimeZoneLauncher.csproj -c Release

      - name: Smoke test loopback proxy
        shell: pwsh
        run: dotnet run --project .\tests\ProxySmokeTest\ProxySmokeTest.csproj -c Release

      - name: Publish self-contained launcher
        shell: pwsh
        run: |
          dotnet publish .\src\CodexTimeZoneLauncher\CodexTimeZoneLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\out\publish
          Copy-Item .\out\native\CodexTzShim64.dll .\out\publish\
          Copy-Item .\out\native\CodexTzBroker64.dll .\out\publish\
          Copy-Item .\out\native\tzshim-launcher.exe .\out\publish\
          Copy-Item .\LICENSE .\out\publish\LICENSE
          Compress-Archive -Path .\out\publish\* -DestinationPath .\out\codex-timezone-launcher-win-x64.zip
          $hash = (Get-FileHash .\out\codex-timezone-launcher-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  codex-timezone-launcher-win-x64.zip" | Set-Content .\out\codex-timezone-launcher-win-x64.zip.sha256 -Encoding ascii

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-timezone-launcher-win-x64
          path: |
            out/codex-timezone-launcher-win-x64.zip
            out/codex-timezone-launcher-win-x64.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "phase1-preview-$env:GITHUB_RUN_NUMBER"
          $notes = @"
          Automated Phase 1 preview build from commit $env:GITHUB_SHA.

          Includes the .NET 10 WinForms launcher, native timezone broker/shim helpers, and process-scoped proxy routing through HTTP, HTTPS, SOCKS5, or SOCKS5h upstreams.
          Proxy credentials remain inside the launcher and are not persisted; Windows system proxy settings are not modified.
          This is still a test build: true single-EXE native-helper embedding and non-zero fixed-offset timezone synthesis are not finished yet.
          "@
          gh release create $tag `
            .\out\codex-timezone-launcher-win-x64.zip `
            .\out\codex-timezone-launcher-win-x64.zip.sha256 `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --prerelease `
            --title "Phase 1 Preview $env:GITHUB_RUN_NUMBER" `
            --notes $notes
